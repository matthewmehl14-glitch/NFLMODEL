name: NFL EV Automation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-simulations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests numpy pandas scipy nfl_data_py; fi

      - name: Run Simulation Script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/run_simulations.py

      - name: Run NFL Backtest
        run: python src/grade_backtest.py

      - name: Save Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update NFL odds, simulations, and history [skip ci]" || exit 0
          git push
