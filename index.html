<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Monte Carlo EV Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="border-b border-slate-800 pb-6 mb-8 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-black tracking-tight text-white">
          <span class="text-red-500">NFL</span> MONTE CARLO <span class="text-blue-500">ENGINE</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Automated Model Projections vs. Pinnacle Lines</p>
      </div>
      <div class="flex items-center space-x-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-medium text-emerald-400">Model Active</span>
      </div>
    </header>

    <!-- Slate Grid -->
    <main>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold uppercase tracking-wider text-slate-200">Upcoming Slate Projections</h2>
        <span id="game-count" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Loading games...</span>
      </div>

      <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Game cards load here -->
      </div>
    </main>
  </div>

  <script>
    async function loadSlate() {
      const container = document.getElementById('games-container');
      const countBadge = document.getElementById('game-count');
      try {
        const res = await fetch('data/upcoming_slate.json');
        if (!res.ok) throw new Error('No data file found yet');
        const games = await res.json();
        
        countBadge.innerText = `${games.length} Games Scheduled`;
        container.innerHTML = games.map(game => `
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-5 shadow-lg relative overflow-hidden">
            <div class="absolute top-0 left-0 h-1 w-full bg-gradient-to-r from-red-600 via-slate-700 to-blue-600"></div>
            <div class="flex justify-between items-center mb-4">
              <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${new Date(game.commence_time).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded ${game.ev > 0 ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                ${game.ev > 0 ? '+' : ''}${game.ev}% EV
              </span>
            </div>
            <div class="space-y-3">
              <div class="flex justify-between items-center bg-slate-950/60 p-2.5 rounded border border-slate-800/80">
                <span class="font-bold text-red-400">${game.away_team}</span>
                <span class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-slate-300">Model: ${game.model_away_prob}%</span>
              </div>
              <div class="flex justify-between items-center bg-slate-950/60 p-2.5 rounded border border-slate-800/80">
                <span class="font-bold text-blue-400">${game.home_team}</span>
                <span class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-slate-300">Model: ${game.model_home_prob}%</span>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex justify-between text-xs text-slate-400">
              <span>Pinnacle Line: <strong class="text-slate-200">${game.pinnacle_spread || 'N/A'}</strong></span>
              <span>Edge: <strong class="${game.edge > 0 ? 'text-emerald-400' : 'text-slate-400'}">${game.edge || '0.0'} pts</strong></span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        countBadge.innerText = '0 Games Loaded';
        container.innerHTML = `
          <div class="col-span-full border border-dashed border-slate-800 rounded-lg p-8 text-center text-slate-500">
            <p class="font-medium text-slate-400 mb-1">Awaiting Slate Data</p>
            <p class="text-xs">Data will populate automatically once the GitHub Action runs and writes <code class="text-blue-400">data/upcoming_slate.json</code>.</p>
          </div>
        `;
      }
    }
    loadSlate();
  </script>
</body>
</html>
