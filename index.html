<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL +EV Projection Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0B1120;
            --card-bg: #131E32;
            --border-color: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --cyan-team: #00B4D8;
            --red-team: #FF4D4D;
            --gold: #F59E0B;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-content {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 12px 0;
        }

        .update-badge {
            display: inline-block;
            background: rgba(0, 180, 216, 0.15);
            color: var(--cyan-team);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(0, 180, 216, 0.3);
            letter-spacing: 0.5px;
        }

        .container {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 40px;
        }

        .prediction-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        .matchup-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            margin-top: -4px;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .prob-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .team-prob-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .team-prob-box.right {
            text-align: right;
            align-items: flex-end;
        }

        .team-logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
            margin-bottom: 2px;
        }

        .prob-val {
            font-size: 34px;
            font-weight: 800;
        }

        .prob-name {
            font-size: 18px;
            color: var(--text-main);
            font-weight: bold;
        }

        .fair-line {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .market-section-title {
            text-align: center;
            font-size: 11px;
            color: var(--gold);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .market-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .market-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .market-item.right {
            text-align: right;
            align-items: flex-end;
        }

        .pinny-line {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .ev-tag {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .ev-positive {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .ev-negative {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .ev-target {
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold);
            border: 1px solid var(--gold);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        .prob-bar-container {
            height: 10px;
            width: 100%;
            background-color: var(--red-team);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            margin-top: 6px;
        }

        .prob-bar-fill {
            height: 100%;
            background-color: var(--cyan-team);
        }

        .total-banner {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .total-banner span {
            color: var(--text-main);
            font-weight: bold;
        }

        .toggle-chart-btn {
            width: 100%;
            background-color: #1E293B;
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .toggle-chart-btn:hover {
            background-color: #334155;
            color: var(--text-main);
        }

        .chart-container {
            display: none;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
            position: relative;
        }

        .chart-container.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header-content">
        <h2>NFL Matchup Prediction Engine</h2>
        <p class="subtitle" id="date-subtitle">Loading Weekly Slate...</p>
        <div class="update-badge" id="update-badge">Last Ran: Loading...</div>
    </div>

    <div class="container" id="games-container"></div>

    <script>
        const stats = ['off_epa_per_play', 'off_pass_epa', 'off_rush_epa', 'def_epa_per_play', 'def_pass_epa', 'def_rush_epa'];
        const statLabels = ['Offense EPA/Play', 'Pass Offense EPA', 'Rush Offense EPA', 'Defense EPA/Play', 'Pass Defense EPA', 'Rush Defense EPA'];

        function probToMoneyline(prob) {
            const p = prob / 100;
            if (p <= 0 || p >= 1) return "--";
            if (p >= 0.5) return Math.round((-100 * p) / (1 - p)).toString();
            return `+${Math.round((100 * (1 - p)) / p)}`;
        }

        function getEVBadgeHTML(evValue, targetThreshold) {
            if (evValue === null || evValue === undefined || evValue === 'N/A') {
                return `<span class="ev-tag">EV: N/A</span>`;
            }
            const sign = evValue > 0 ? '+' : '';
            if (evValue >= targetThreshold) {
                return `<span class="ev-tag ev-target">🔥 TARGET: ${sign}${evValue.toFixed(1)}%</span>`;
            } else {
                const colorClass = evValue > 0 ? 'ev-positive' : 'ev-negative';
                return `<span class="ev-tag ${colorClass}">EV: ${sign}${evValue.toFixed(1)}%</span>`;
            }
        }

        function toggleChart(index, btnElement) {
            const chartDiv = document.getElementById(`chart-container-${index}`);
            if (chartDiv.classList.contains('active')) {
                chartDiv.classList.remove('active');
                btnElement.textContent = 'Show Matchup Chart';
            } else {
                chartDiv.classList.add('active');
                btnElement.textContent = 'Hide Matchup Chart';
            }
        }

        fetch('./data.json?t=' + new Date().getTime(), { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                if (data.last_updated) {
                    const updateTime = new Date(data.last_updated);
                    const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' };
                    document.getElementById('update-badge').textContent = "Last Ran: " + updateTime.toLocaleString('en-US', options);
                }

                const todaysGames = data.todays_games || [];
                document.getElementById('date-subtitle').textContent = `Slate for ${data.date || data.target_date || 'Current'} (10,000 Sims per game)`;

                const container = document.getElementById('games-container');
                container.innerHTML = '';

                if (todaysGames.length === 0) {
                    container.innerHTML = '<p style="text-align: center;">No games found for this slate</p>';
                    return;
                }

                todaysGames.forEach((game, index) => {
                    const sim = game.simulation || {};
                    const mkt = game.market_data || {};
                    
                    const fairMargin = (sim.home_proj - sim.away_proj).toFixed(1);
                    const awayFairSp = fairMargin > 0 ? `+${fairMargin}` : fairMargin;
                    const homeFairSp = fairMargin > 0 ? `-${fairMargin}` : `+${Math.abs(fairMargin)}`;

                    const spAwayLine = mkt.spreads?.away_line;
                    const spHomeLine = mkt.spreads?.home_line;

                    let totalsHTML = '';
                    if (mkt.totals?.total && mkt.totals.total !== 'N/A') {
                        totalsHTML = `
                            <div class="market-section-title">Pinnacle Total Market</div>
                            <div class="market-row">
                                <div class="market-item">
                                    <div>
                                        <span class="pinny-line">O ${mkt.totals.total} (${mkt.totals.over > 0 ? '+' : ''}${mkt.totals.over || 'N/A'})</span>
                                        ${getEVBadgeHTML(mkt.over_ev, 1.5)}
                                    </div>
                                </div>
                                <div class="market-item right">
                                    <div>
                                        <span class="pinny-line">U ${mkt.totals.total} (${mkt.totals.under > 0 ? '+' : ''}${mkt.totals.under || 'N/A'})</span>
                                        ${getEVBadgeHTML(mkt.under_ev, 1.5)}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    const cardHTML = `
                        <div class="prediction-card">
                            <div class="matchup-title">${game.away_team} @ ${game.home_team}</div>
                            <div class="card-header">
                                <span>Monte Carlo Projections</span>
                                <span>Proj. Total: ${sim.total_proj || '--'}</span>
                            </div>

                            <div class="prob-row">
                                <div class="team-prob-box">
                                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${game.away_team.toLowerCase()}.png" alt="${game.away_team}">
                                    <span class="prob-val" style="color: var(--cyan-team)">${sim.away_win_prob || '--'}%</span>
                                    <span class="prob-name">${game.away_team}</span>
                                    <span class="fair-line">Fair ML: ${probToMoneyline(sim.away_win_prob)}</span>
                                    <span class="fair-line">Fair Spread: ${awayFairSp}</span>
                                </div>
                                <div class="team-prob-box right">
                                    <img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${game.home_team.toLowerCase()}.png" alt="${game.home_team}">
                                    <span class="prob-val" style="color: var(--red-team)">${sim.home_win_prob || '--'}%</span>
                                    <span class="prob-name">${game.home_team}</span>
                                    <span class="fair-line">Fair ML: ${probToMoneyline(sim.home_win_prob)}</span>
                                    <span class="fair-line">Fair Spread: ${homeFairSp}</span>
                                </div>
                            </div>

                            <div class="prob-bar-container">
                                <div class="prob-bar-fill" style="width: ${sim.away_win_prob || 50}%;"></div>
                            </div>

                            <div class="total-banner">
                                Projected Score: <span>${game.away_team} ${sim.away_proj || 0} - ${game.home_team} ${sim.home_proj || 0}</span>
                            </div>

                            <div class="market-section-title">Pinnacle Moneyline Market</div>
                            <div class="market-row">
                                <div class="market-item">
                                    <div>
                                        <span class="pinny-line">PINN: ${mkt.h2h?.away > 0 ? '+' : ''}${mkt.h2h?.away || 'N/A'}</span>
                                        ${getEVBadgeHTML(mkt.away_ml_ev, 3.0)}
                                    </div>
                                </div>
                                <div class="market-item right">
                                    <div>
                                        <span class="pinny-line">PINN: ${mkt.h2h?.home > 0 ? '+' : ''}${mkt.h2h?.home || 'N/A'}</span>
                                        ${getEVBadgeHTML(mkt.home_ml_ev, 3.0)}
                                    </div>
                                </div>
                            </div>

                            <div class="market-section-title">Pinnacle Spread Market</div>
                            <div class="market-row">
                                <div class="market-item">
                                    <div>
                                        <span class="pinny-line">PINN: ${spAwayLine > 0 ? '+' : ''}${spAwayLine || '-'} (${mkt.spreads?.away > 0 ? '+' : ''}${mkt.spreads?.away || 'N/A'})</span>
                                        ${getEVBadgeHTML(mkt.away_sp_ev, 1.5)}
                                    </div>
                                </div>
                                <div class="market-item right">
                                    <div>
                                        <span class="pinny-line">PINN: ${spHomeLine > 0 ? '+' : ''}${spHomeLine || '-'} (${mkt.spreads?.home > 0 ? '+' : ''}${mkt.spreads?.home || 'N/A'})</span>
                                        ${getEVBadgeHTML(mkt.home_sp_ev, 1.5)}
                                    </div>
                                </div>
                            </div>

                            ${totalsHTML}

                            <button class="toggle-chart-btn" onclick="toggleChart(${index}, this)">Show Matchup Chart</button>
                            
                            <div class="chart-container" id="chart-container-${index}">
                                <canvas id="chart-${index}"></canvas>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });

                todaysGames.forEach((game, index) => {
                    if (game.away_stats && game.home_stats) {
                        const ctx = document.getElementById(`chart-${index}`).getContext('2d');
                        new Chart(ctx, {
                            type: 'radar',
                            data: {
                                labels: statLabels,
                                datasets: [
                                    { 
                                        label: game.away_team, 
                                        data: stats.map(s => ((game.away_stats[s] + 0.3) / 0.6) * 100), 
                                        backgroundColor: 'rgba(0, 180, 216, 0.35)', 
                                        borderColor: '#00B4D8', 
                                        pointBackgroundColor: '#00B4D8' 
                                    },
                                    { 
                                        label: game.home_team, 
                                        data: stats.map(s => ((game.home_stats[s] + 0.3) / 0.6) * 100), 
                                        backgroundColor: 'rgba(255, 77, 77, 0.35)', 
                                        borderColor: '#FF4D4D', 
                                        pointBackgroundColor: '#FF4D4D' 
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                scales: {
                                    r: {
                                        min: 0, max: 100,
                                        ticks: { display: false },
                                        grid: { color: '#1E293B' },
                                        angleLines: { color: '#1E293B' },
                                        pointLabels: { color: '#E2E8F0', font: { size: 10, weight: 'bold' } }
                                    }
                                },
                                plugins: {
                                    legend: { display: false }
                                }
                            }
                        });
                    }
                });
            })
            .catch(err => {
                console.error("Error loading JSON:", err);
                document.getElementById('date-subtitle').textContent = "Error loading data.";
            });
    </script>
</body>
</html>
